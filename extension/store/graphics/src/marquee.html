<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Unscroll marquee</title><link rel="stylesheet" href="frames.css"></head>
<body>
  <div class="stage marquee soft" id="stage">
    <div class="marquee-layout">
      <div>
        <div class="promo-brand" style="margin-bottom:18px">
          <img src="assets/icon.svg" width="72" height="72" alt="">
          <div class="promo-name">Unscroll</div>
        </div>
        <p class="promo-tag">Open-source, local-first site time for your browser. Daily limits, focus sessions, and optional end-to-end encrypted sync.</p>
      </div>
      <div class="marquee-devices">
        <div class="device-window marquee-window">
          <div class="chrome-bar" aria-hidden="true">
            <span class="traffic"><i></i><i></i><i></i></span>
            <span class="chrome-title">Unscroll</span>
            <span style="min-width:48px"></span>
          </div>
          <img src="assets/home.png" width="1280" height="825" alt="">
        </div>
        <div class="marquee-popup">
          <img src="assets/popup.png" width="400" height="720" alt="">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
