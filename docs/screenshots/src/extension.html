<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unscroll Browser extension</title>
  <link rel="stylesheet" href="frames.css">
</head>
<body>
  <div class="stage card card-ext" id="stage">
    <div class="device-browser">
      <div class="chrome-bar browser-bar" aria-hidden="true">
        <span class="traffic"><i></i><i></i><i></i></span>
        <span class="url">
          <svg class="lock" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <rect x="3.5" y="7" width="9" height="6.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span>unscroll.elimbi.com</span>
        </span>
        <span class="ext-pin">
          <svg viewBox="0 0 32 32" width="16" height="16" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#141a24"/>
            <circle cx="16" cy="16" r="8.25" fill="none" stroke="#314056" stroke-width="3"/>
            <circle cx="16" cy="16" r="8.25" fill="none" stroke="#e39a56" stroke-width="3" stroke-linecap="round" stroke-dasharray="34 52" transform="rotate(-80 16 16)"/>
          </svg>
        </span>
      </div>
      <div class="browser-page">
        <div class="browser-ghost" aria-hidden="true">
          <span class="ghost-kicker"></span>
          <span class="ghost-title"></span>
          <span class="ghost-line"></span>
          <span class="ghost-line is-short"></span>
          <span class="ghost-cards"><i></i><i></i><i></i></span>
        </div>
        <div class="ext-popup">
          <img src="assets/extension-popup.png" width="400" height="720" alt="">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
